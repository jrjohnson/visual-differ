name: Visual Diff

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]

concurrency:
  group: visual-diff-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  baseline-info:
    name: Baseline Info
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
      - id: ref
        run: |
          echo "$(git rev-parse HEAD)"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - name: Read Playwright Version
        id: playwright
        run: |
          version=$(pnpm ls --json --lockfile-only --dev @playwright/test | jq -r '.[0].devDependencies["@playwright/test"].version')
          echo "@playwright/test version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  baseline:
    name: Baseline
    needs: baseline-info
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.baseline-info.outputs.playwright-version }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.baseline-info.outputs.ref }}
      - name: Cache Screenshots
        id: screenshot-cache
        uses: actions/cache@v6
        with:
          path: build
          key: screenshots-${{ needs.baseline-info.outputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        if: steps.screenshot-cache.outputs.cache-hit != 'true'
        run: pnpm install
      - name: Capture Screenshots
        if: steps.screenshot-cache.outputs.cache-hit != 'true'
        run: pnpm run test:screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: baseline
          path: build

  candidate-info:
    name: Candidate Info
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: ref
        run: |
          echo "$(git rev-parse HEAD)"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - name: Read Playwright Version
        id: playwright
        run: |
          version=$(pnpm ls --json --lockfile-only --dev @playwright/test | jq -r '.[0].devDependencies["@playwright/test"].version')
          echo "@playwright/test version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  candidate:
    name: Candidate
    needs: candidate-info
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.candidate-info.outputs.playwright-version }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-info.outputs.ref }}
      - name: Cache Screenshots
        id: screenshot-cache
        uses: actions/cache@v6
        with:
          path: build
          key: screenshots-${{ needs.candidate-info.outputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        if: steps.screenshot-cache.outputs.cache-hit != 'true'
        run: pnpm install
      - name: Capture Screenshots
        if: steps.screenshot-cache.outputs.cache-hit != 'true'
        run: pnpm test:screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: candidate
          path: build

  compare:
    name: Visual Diff
    needs: [baseline-info, baseline, candidate-info, candidate]
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: visual-diff-${{ github.event.pull_request.number }}
      BASELINE_REF: ${{needs.baseline-info.outputs.ref}}
      CANDIDATE_REF: ${{needs.candidate-info.outputs.ref}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - name: Restore Comparison Cache
        id: comparison-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.OUTPUT_DIR }}
            results
          key: comparison-${{ env.BASELINE_REF }}-${{ env.CANDIDATE_REF }}
      - uses: actions/download-artifact@v8
        if: steps.comparison-cache.outputs.cache-hit != 'true'
      - run: ls -lh baseline candidate 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: steps.comparison-cache.outputs.cache-hit != 'true'
        with:
          name: combined-screenshots
          path: |
            baseline
            candidate
      - run: |
          mkdir -p ./results
          echo ${{ github.event.pull_request.number }} > ./results/pr_number
      - run: pnpm install
        if: steps.comparison-cache.outputs.cache-hit != 'true'
      - run: pnpm build
        if: steps.comparison-cache.outputs.cache-hit != 'true'
      - name: Create Visual Diff
        if: steps.comparison-cache.outputs.cache-hit != 'true'
        run: |
          set +e
          node ./dist/bin/visual-differ.js --threshold=0.1 baseline candidate ${{ env.OUTPUT_DIR }} > results/visual-diff.txt
          exit_code=$?
          echo $exit_code > ./results/exit_code
          cp ${{ env.OUTPUT_DIR }}/report.md results/
          cat results/report.md results/visual-diff.txt
      - uses: actions/upload-artifact@v7
        id: upload-output
        with:
          name: ${{ env.OUTPUT_DIR }}
          path: ${{ env.OUTPUT_DIR }}
      - run: |
          echo ${{ steps.upload-output.outputs.artifact-url }} > ./results/artifact_url
          echo ${{ contains(github.event.pull_request.labels.*.name, 'approve visual diff') }} > ./results/approved
      - name: Save Comparison Cache
        if: steps.comparison-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.OUTPUT_DIR }}
            results
          key: ${{ steps.comparison-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: results
      - name: Check Status
        run: |
          exitCode=$(cat ./results/exit_code)
          approved=$(cat ./results/approved)
          echo "visual-differ exit code: $exitCode"
          echo "approve visual diff label present: $approved"
          if [ "$exitCode" != "0" ] && [ "$approved" != "true" ]; then
            echo "Visual diff detected and 'approve visual diff' label not present."
            exit 1
          fi
