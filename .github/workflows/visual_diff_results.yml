name: Visual Diff Results

on:
  workflow_run:
    workflows: [Visual Diff]
    types:
      - completed

jobs:
  prepare:
    name: Prepare Visual Diff Results
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      issue_number: ${{ steps.results.outputs.issue_number }}
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/results

      - name: Read Results
        id: results
        run: |
          echo "issue_number=$(cat "${RUNNER_TEMP}/results/pr_number")" >> "$GITHUB_OUTPUT"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: ${{ runner.temp }}/results

  publish:
    name: Publish Visual Diff Report
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: results
          path: ${{ runner.temp }}/results

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          role-session-name: visual-diff-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true

      - name: Sync Report to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PR_NUMBER: ${{ needs.prepare.outputs.issue_number }}
        run: |
          aws s3 sync \
            "${RUNNER_TEMP}/results/report/" \
            "s3://${S3_BUCKET}/visual-differ/pr${PR_NUMBER}/" \
            --delete \
            --no-follow-symlinks

  comment:
    name: Comment on Pull Request
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    env:
      MARKER: '<!-- visual-diff-results -->'
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          name: results
          path: ${{ runner.temp }}/results

      - name: Prepare Comment
        env:
          PUBLIC_DIFF_BASE_URL: ${{ vars.PUBLIC_DIFF_BASE_URL }}
          PR_NUMBER: ${{ needs.prepare.outputs.issue_number }}
        run: |
          EXIT_CODE="$(cat "${RUNNER_TEMP}/results/exit_code")"
          APPROVED="$(cat "${RUNNER_TEMP}/results/approved")"
          PUBLIC_URL="${PUBLIC_DIFF_BASE_URL%/}/visual-differ/pr${PR_NUMBER}/index.html"

          {
            if [ "$EXIT_CODE" != "0" ] && [ "$APPROVED" = "true" ]; then
              echo "### ✅ Visual Diff Approved"
              echo
            fi

            cat "${RUNNER_TEMP}/results/report.md"

            echo
            echo
            echo "View the [report](${PUBLIC_URL})."
            echo
            echo "$MARKER"
          } > "${RUNNER_TEMP}/comment.md"

      - name: Find Previous Comment
        uses: peter-evans/find-comment@v4
        id: find
        with:
          issue-number: ${{ needs.prepare.outputs.issue_number }}
          body-includes: ${{ env.MARKER }}

      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ needs.prepare.outputs.issue_number }}
          body-path: ${{ runner.temp }}/comment.md
          edit-mode: replace
